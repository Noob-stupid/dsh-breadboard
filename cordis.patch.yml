# ============================================================================
# dsh-hardware-sandbox —— DSH bundle patch
# ============================================================================
# 这是插件的**挂载声明**。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把硬件沙盒插入 profile 的配置树。
#
# ★★ 没有这个文件会发生什么（实测踩过，而且症状极具误导性）：
#   插件列表里它显示 **「异常：这个包没有声明组合包，不能作为插件管理」**，
#   而**真正被挡住的是装配本身** —— 宿主半没进 loader ⇒ 所有 `/api/*` 返回 404
#   ⇒ 界面上表现为"**沙盒按钮不见了**"。**报错说的是 A，坏掉的是 B。**
#
# 安装方式：
#   dsh plugin --profile web add link:<本目录绝对路径>
# 或本地开发：
#   dev_install_package <本目录>     （写 profile 的 bundles + 建 junction + 动态加载）
# ============================================================================

- insert:
    - id: dsh-hardware-sandbox
      name: '@dsh-breadboard/dsh-hardware-sandbox'
      config: {}
